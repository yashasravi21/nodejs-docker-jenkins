name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Install and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t nodejs-docker-jenkins:${{ github.sha }} .

      - name: Start the container
        run: |
          docker run -d --name app -p 3000:3000 nodejs-docker-jenkins:${{ github.sha }}

      - name: Verify /health responds
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:3000/health; then
              echo "Container is healthy."
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      - name: Verify /metrics is exposed
        run: curl -fs http://localhost:3000/metrics | head -20
